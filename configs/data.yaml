# Data sources, join, split, and caption-decomposition config.
# No object/join counts are hardcoded here (see 05_build_spec_image_spectra.md §1) —
# only warning thresholds, which are config, not spec constants.

sources:
  spectra:
    hf_path: UniverseTBD/AstroBridge-Data
    revision: null   # not loaded via `datasets.load_dataset` — see data/spectra_dataset.py.
                      # No `split` here: the repo's multiple parquet files are read directly.
  image:
    hf_path: gapatron/legacy_survey_south_images_captions
    revision: null   # not a `datasets.load_dataset`-shaped repo — see data/image_dataset.py.
                      # No `split` here: it's loaded as raw file pairs, not a HF Dataset split.
  spectra_captions:
    # Teammate-produced, spectrum-grounded LLM captions (Gemini) — the spectra-tier equivalent
    # of gapatron's caption_blind for images. Spectra-tier captions are restricted to just the
    # objects this file covers (see scripts/01_generate_captions.py) rather than falling back to
    # mention_summary decomposition for the rest — a deliberate scope choice, not a limitation
    # of the loader. v2: now hosted directly in AstroBridge-Data rather than a separate personal
    # repo — confirmed live: 2,021 usable captions (up from 1,223 in v1), object_key format
    # (gmw_XXXXXXXX) still matches the spectra table's wiki_entity_id column.
    hf_path: UniverseTBD/AstroBridge-Data
    filename: captions/spectra/desi_sdss_combined_v2_gemini-3_7-flash.jsonl
    revision: null
  transients:
    # 987 ZTF BTS supernovae with accepted alert photometry — the only source of time-domain data.
    # Its `object_id` is a ZTF designation, a namespace shared with nothing else here, so these
    # objects are APPENDED to the manifest as new rows rather than joined (see data/manifest.py).
    # The host-image columns (`image_flux`, `display_image`, `host_image_caption`) are debugging
    # artifacts and are deliberately never read — transients contribute the lightcurve tier only.
    hf_path: BuildNg/astrobridge-transients-dataset
    revision: null   # not loaded via `datasets.load_dataset` — see data/transients_dataset.py

join:
  key: _healpix_29
  fallback_radius_arcsec: 1.0   # coordinate crossmatch radius when `key` isn't in both tables

splits:
  # train is implicit (everything not assigned to val/test). val/test are drawn according to
  # `policy` below, and unpaired objects always go to train — see manifest.py.
  policy: stratified
  # stratified | joint_only | auto.
  #   auto       - the original behaviour: joint-only when there are at least
  #                sanity.min_joint_objects of them, otherwise stratified across all tiers.
  #   stratified - always draw val/test from all tiers, stratified by tier.
  #   joint_only - always draw from joint-tier objects only.
  # Pinned to `stratified` deliberately rather than left on `auto`: `auto` silently changes the
  # meaning of val/test as soon as the joint count crosses min_joint_objects, which would make
  # val_loss incomparable across runs for a reason nothing in the logs points at.
  val: 0.1
  test: 0.1
  seed: ${seed}          # resolved from base.yaml at load time

sanity:
  min_joint_objects: 500      # log a loud warning below this; do not fail
  min_per_subset: 50          # warn if any dropout-weighted subset is thinner than this

manifest:
  out_dir: outputs/manifest
  parquet: outputs/manifest/manifest.parquet
  stats: outputs/manifest/manifest_stats.json

cache:
  out_dir: outputs/cache

captions:
  out_dir: outputs/captions
  parquet: outputs/captions/captions.parquet
  report: outputs/captions/decomposition_report.json
  # Image-tier captions come directly from gapatron's pre-vetted `caption_blind` field (see
  # data/image_dataset.py), not from keyword-based decomposition — so `rule_based_v0` below only
  # governs decomposition of AstroBridge-Data's `mention_summary` (spectra + relational claims).
  generator: rule_based_v0     # swap for an LLM-backed extractor; see src/captioner/data/captions.py
