# --- Capacity knobs — the ones to open as modality count grows ---
# `d_shared` and everything under `qformer` are sized for today's 2 registered modalities
# (image, spectra) with the joint subset dormant (see README.md's roadmap / configs/
# modalities.yaml's dropout comment). They are NOT tied to modality count anywhere in code —
# FusionStack/SharedQFormer read these purely from config — so scaling them up when a 3rd
# modality is added, or when joint (cross-modal) training resumes, is a config-only change.
# What to bump and why, per the build spec §6 ("query count is the first knob to open" if joint
# claims come out weak):
#   - qformer.n_queries: the hard bottleneck every cross-modal relation has to survive
#     compression into. More modalities => more possible subset combinations (7 at 3 modalities
#     vs. 3 at 2) => more content competing for the same fixed-size prefix. First thing to raise.
#   - d_shared / qformer.d_model (keep these equal): the width of the space modality tokens get
#     projected into before the Q-Former sees them. Raise alongside n_queries if per-query
#     capacity, not just query count, looks like the bottleneck.
#   - qformer.n_layers: more cross-attention rounds to integrate a 3rd modality's evidence
#     against the other two. Usually the last knob to touch, not the first.
# Verified directly during this build: constructing a FusionStack with 3 modalities and
# d_shared=768/n_queries=64 (2x today's values) and running a real forward pass required no
# source changes — only these numbers.
d_shared: 384

qformer:
  n_queries: 48        # raised from 32 when `lightcurve` was added — see the note above:
                       # more modalities => more subset combinations competing for the same
                       # fixed-size prefix, and query count is the first knob to open.
  d_model: 384
  n_layers: 3
  n_heads: 6
  ffn_mult: 4
  dropout: 0.1

projector:
  hidden_mult: 2      # 2-layer MLP: out_dim -> out_dim*hidden_mult -> d_shared
  dropout: 0.1

llm:
  name: google/gemma-4-12B-it
  # Deliberately the instruction-tuned checkpoint, not the plain `google/gemma-4-12B` base —
  # confirmed real, not a default: the base checkpoint ships no chat template at all (no
  # `chat_template.jinja`, no `chat_template` key in tokenizer_config.json), so it can't answer
  # "describe this image" coherently out of the box, which would make the post-training
  # base-vs-equipped comparison (inference/compare.py) meaningless. `-it` is architecturally
  # identical to the base model (same Gemma4UnifiedForConditionalGeneration class, same
  # hidden_size/layers/vocab — confirmed against both configs directly), so this is a pure
  # weight-source swap, and training itself never touches the chat template anyway (generate_
  # caption tokenizes the prompt as plain text, not via apply_chat_template) — using `-it` for
  # both training and the comparison baseline just means both sides start from the exact same
  # weights, isolating what this project's own architecture adds.
  dtype: bfloat16
  # Gemma4UnifiedForConditionalGeneration mixes sliding-window and full-attention layers (a
  # repeating pattern, not a plain Llama-style transformer) but is a standard, natively-supported
  # architecture as of transformers>=5.10 (unlike Qwen3.5's hybrid DeltaNet layers, which needed
  # trust_remote_code). `sdpa` is the safe default; try flash_attention_2 once you've confirmed
  # the installed transformers version actually supports it for every layer type here.
  attn_impl: sdpa
  trust_remote_code: false   # confirmed live: AutoConfig.from_pretrained(..., trust_remote_code=
                              # False) resolves natively (Gemma4UnifiedConfig) against transformers
                              # 5.16.1 — no remote code needed, unlike Qwen3.5's hybrid arch.
  quantization: null        # null = bf16 (~24GB weights for 12B, vs. ~18GB for Qwen3.5-9B —
                             # confirm your training GPU(s) still fit this before switching).
                             # "nf4" = QLoRA fallback if your GPUs are smaller than that. MUST be
                             # identical in stage1 and stage2 — see §10.

prompt:
  # Text prompt template embedded ahead of the caption target. {modalities} is filled with
  # the human-readable subset present for this example (e.g. "an image and a spectrum").
  template: "Describe the object shown, using only {modalities}."
