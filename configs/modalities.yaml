# THE modality registry. Adding a modality = editing this file (+ ~30 lines for a new `impl`
# wrapper in src/captioner/encoders/ if no existing wrapper fits). No other file should need
# to change — see acceptance test in 05_build_spec_image_spectra.md §3.

# IMAGE-ONLY BRANCH (train-v2-images). Only `image` is registered. The `spectra` /
# `lightcurve` blocks are removed here (their encoder wrappers in encoders/registry.py still
# exist and are still tested — just not referenced). Re-adding a modality is: paste its block
# back + add a source in configs/data.yaml + a subset_weight below.
modalities:
  image:
    encoder:
      impl: aion_image                       # wrapper class in encoders/registry.py
      hf_path: polymathic-ai/aion-base       # actual weights — swap this for ablations
      revision: null                         # pin a commit sha for reproducibility
      kwargs:
        bands: [DES-G, DES-R, DES-Z]
    out_dim: 768                             # asserted against the encoder's real output at load
    max_tokens: 576

dropout:
  # IMAGE-ONLY BRANCH: one modality, one subset. `_sample_target_subset` in data/dataset.py
  # just always picks {image}. (Re-adding a modality = add its subset + any joint subsets here.)
  subset_weights:
    - subset: [image]
      weight: 1.0
