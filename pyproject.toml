[project]
name = "captioner"
version = "0.1.0"
description = "n-modality captioner: shared Q-Former + LoRA-adapted LLM decoder"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.42",
    "peft>=0.11",
    "accelerate>=0.30",
    "huggingface_hub>=0.23",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "omegaconf>=2.3",
    "astropy>=6.0",
    "polymathic-aion",   # provides the `aion` import (AION, CodecManager, aion.modalities.*)
                          # — see src/captioner/encoders/aion_common.py. No version pinned here;
                          # confirm against https://huggingface.co/polymathic-ai/aion-base's
                          # install instructions if a specific version turns out to matter.
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
