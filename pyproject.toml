[project]
name = "captioner"
version = "0.1.0"
description = "n-modality captioner: shared Q-Former + LoRA-adapted LLM decoder"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.42",
    "peft>=0.11",
    "accelerate>=0.30",
    "datasets>=2.19",
    "huggingface_hub>=0.23",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "omegaconf>=2.3",
    "tqdm>=4.66",
    "astropy>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
